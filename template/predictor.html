<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monsoon Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='design.css') }}">
</head>
<body>
  <div class="rain-field"></div>

  <div class="shell">
    <a href="{{ url_for('home') }}" class="back-link">Back to overview</a>

    <div class="form-wrap">
      <form action="/predict" method="post" class="panel form-panel">
        <div class="eyebrow">Forecast Input</div>
        <h1>Run a prediction</h1>
        <p class="sub">Choose today or a date within the next five days.</p>

        {% if error %}
        <p class="section-note" role="alert">{{ error }}</p>
        {% endif %}

        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required>
        </div>

        <div class="field">
          <label for="sts">State</label>
          <select id="sts" name="state" required>
            <option value="">Select State</option>
            {% for region in locations %}<option value="{{ region }}">{{ region }}</option>{% endfor %}
          </select>
        </div>

        <div class="field">
          <label for="state">City</label>
          <select id="state" name="city" required disabled>
            <option value="">Select City</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Predict</button>
      </form>
    </div>
  </div>

  <script>
    const locations = {{ locations | tojson }};
    const stateSelect = document.getElementById('sts');
    const citySelect = document.getElementById('state');
    stateSelect.addEventListener('change', function () {
      citySelect.innerHTML = '<option value="">Select City</option>';
      (locations[this.value] || []).forEach(function (city) {
        citySelect.add(new Option(city, city));
      });
      citySelect.disabled = !this.value;
    });

    // Default the date field to today and guard against the browser
    // rendering an out-of-range placeholder year.
    (function () {
      var dateInput = document.getElementById('date');
      var today = new Date();
      var iso = today.toISOString().split('T')[0];
      dateInput.value = iso;
      dateInput.min = iso;
      var lastDay = new Date(today);
      lastDay.setDate(lastDay.getDate() + 5);
      dateInput.max = lastDay.toISOString().split('T')[0];
    })();
  </script>
</body>
</html>
